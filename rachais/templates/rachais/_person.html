{% load rachai %}{# Nome que abre o card com a chave Pix. Parâmetros: p (Participant), sub (texto opcional), tag (mostra o selo Pix). #}<button type="button" class="person-link" aria-haspopup="dialog" data-person-name="{{ p.display_name }}" data-person-pix="{{ p.pix_key }}" data-person-ini="{{ p.display_name|initials }}" data-person-tone="{{ p.id|tone }}" data-person-sub="{{ sub|default:'' }}"><span class="person-name">{{ p.display_name }}</span>{% if tag and p.pix_key %}<span class="pix-tag">Pix</span>{% endif %}</button>
